name: Improvement idea
description: Suggest a useful repository improvement
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What should improve?
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why is it useful?
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Possible approach
    validations:
      required: false
